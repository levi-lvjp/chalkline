# Disclosure answers; paths below are relative to plugin/ (refresh at final SHA).
# 1. Customer model exposure: channels/frontdesk.py:69 capture has no LLM call.
#    core/tools.py:114 returns queries.job_detail, including customer source text.
#    core/queries.py:45-67 returns evidence text/file references, not image/audio
#    bytes. core/receipts.py:25-38 explicitly uploads selected cached image bytes.
#    core/tools.py:42-50 restricts receipt input to current-profile media caches.
# 2. Ack: channels/frontdesk.py:57-60 requires a resolved phone and approved
#    standing template. core/service.py:850-893 atomically enforces the 12h window.
#    It is not unconditional: groups/echoes skip, absent templates stay silent,
#    unresolved LIDs are captured for owner review without an automatic reply.
# 3. Tick: channels/tick.py:108-110 creates */15 * * * * with no_agent=True.
#    The generated profile script imports run_tick; it makes no model call.
#    Real Hermes scheduler subprocess tests verified this against profile SQLite.
# 4. Dependency: plugin.yaml:24-25 declares only fpdf2>=2.8.4,<3.
#    Pillow is transitive; FastAPI and the messaging bridge come from Hermes.
# 5. requires_hermes >=0.22.2 matches the locally tested release. It does not
#    imply verification on every host or Cloud operation.

