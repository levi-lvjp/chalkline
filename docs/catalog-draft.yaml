readme: true
description: >-
  A Hermes back office for solo tradespeople: capture enquiries, prepare quote
  and invoice PDFs, retain receipts and agreed extras, review follow-ups and
  export an accountant ZIP. Customer sends require payload-bound owner approval,
  except three template kinds approved once by hash. Disclosure — WhatsApp uses
  Hermes' unofficial Baileys bridge and can expose the linked number to restriction
  or ban; use a dedicated business number. Three-account live tests verified
  text/photo/voice intake, owner-only quote approval, customer PDF receipt and
  one reminder from two accelerated real scheduler runs. Records, evidence copies,
  PDFs and exports persist in the active profile's SQLite database and plugin data
  folder. Intake makes no model call, but customer text/transcript evidence can
  reach the configured model when the owner queries a job. Owner messages/media
  follow Hermes provider configuration, and receipt extraction explicitly sends
  the selected cached image to the configured vision provider. Customer voice
  is stored without automatic transcription. The plugin adds no telemetry endpoint.
  Approved sends spawn the public hermes send CLI. A 15-minute no-agent Python
  script runs scheduled work; Telegram uses Hermes handler integration.
  Local Desktop API and 390px page rendering
  were verified. Cloud/Webapp and native Desktop activation remain unverified.
  Adds /office owner commands, a Desktop page, authenticated dashboard API,
  Telegram approval buttons, and one recurring no-agent cron job. Installation
  takes over non-owner WhatsApp intake. Setup requires explicit restrict_toolsets=true
  consent on a named dedicated business profile, backs up config.yaml.bak, then
  restricts WhatsApp, Telegram, CLI and cron toolsets. Run the dedicated profile in its own
  Hermes home, or standalone. No payment processing, email or jurisdiction-specific tax rules.
known_issues:
  - "Cloud deployment and native Desktop activation remain unverified."
  - "Customer voice notes are stored without automatic transcription."
